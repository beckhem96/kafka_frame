# docker-compose.yml
version: "3.8"

services:
  zookeeper:
    image: confluentinc/cp-zookeeper:7.5.0
    container_name: zookeeper
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000
    ports:
      - "2181:2181"
    networks:
      - elk-network

  kafka:
    image: confluentinc/cp-kafka:7.5.0
    container_name: kafka
    depends_on:
      - zookeeper
    ports:
      - "9092:9092"    # 내부용 포트(컨테이너 네트워크에서 kafka:9092)
      - "29092:29092"  # 호스트 접근용 포트(PC에서 localhost:29092)
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_LISTENERS: PLAINTEXT://0.0.0.0:9092,PLAINTEXT_HOST://0.0.0.0:29092
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092,PLAINTEXT_HOST://localhost:29092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
      # ✅ 토픽별 보존 기간 설정
      KAFKA_LOG_RETENTION_HOURS: 168  # 7일
    networks:
      - elk-network
    healthcheck:
      test: [ "CMD", "kafka-broker-api-versions", "--bootstrap-server", "localhost:9092" ]
      interval: 10s
      timeout: 5s
      retries: 12

  # ===== Elasticsearch =====
  # 로그를 저장하고 검색하는 엔진
  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:8.11.0
    container_name: elasticsearch
    environment:
      # 단일 노드 모드 (개발용)
      - discovery.type=single-node
      # 보안 비활성화 (개발용)
      - xpack.security.enabled=false
      # JVM 힙 메모리 설정
      - "ES_JAVA_OPTS=-Xms512m -Xmx512m"
      - cluster.name=kafka-elk-cluster
    ports:
      - "9200:9200"  # HTTP API
      - "9300:9300"  # 노드 간 통신
    volumes:
      - elasticsearch-data:/usr/share/elasticsearch/data
    networks:
      - elk-network
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:9200/_cluster/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5

  # ===== Logstash =====
  # Kafka에서 로그를 읽어 파싱 후 Elasticsearch로 전송
  logstash:
    image: docker.elastic.co/logstash/logstash:8.11.0
    container_name: logstash
    depends_on:
      elasticsearch:
        condition: service_healthy
      kafka:
        condition: service_healthy
    ports:
      - "5044:5044"  # Beats input
      - "9600:9600"  # Monitoring API
    volumes:
      # Logstash 설정 파일 마운트
      - ./logstash/pipeline:/usr/share/logstash/pipeline
      - ./logstash/config/logstash.yml:/usr/share/logstash/config/logstash.yml
    environment:
      - "LS_JAVA_OPTS=-Xms256m -Xmx256m"
    networks:
      - elk-network

  # ===== Kibana =====
  # Elasticsearch 데이터를 시각화하는 웹 UI
  kibana:
    image: docker.elastic.co/kibana/kibana:8.11.0
    container_name: kibana
    depends_on:
      elasticsearch:
        condition: service_healthy
    ports:
      - "5601:5601"  # Web UI
    environment:
      # Elasticsearch 연결 설정
      ELASTICSEARCH_HOSTS: http://elasticsearch:9200
      # 보안 비활성화 (개발용)
      XPACK_SECURITY_ENABLED: false
    networks:
      - elk-network

  # ===== Kafka UI (선택사항) =====
  kafka-ui:
    image: provectuslabs/kafka-ui:latest
    container_name: kafka-ui
    depends_on:
      - kafka
    ports:
      - "8090:8080"
    environment:
      KAFKA_CLUSTERS_0_NAME: local
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: kafka:9092
    networks:
      - elk-network

volumes:
  elasticsearch-data:

networks:
  elk-network:
    driver: bridge