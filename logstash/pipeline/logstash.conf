# ===== Input: Kafka에서 읽기 =====
input {
  # 주문 도메인
  kafka {
    bootstrap_servers => "kafka:9092"
    topics => ["app-logs-order"]
    group_id => "logstash-order"
    consumer_threads => 4
    codec => json
  }

  # 결제 도메인
  kafka {
    bootstrap_servers => "kafka:9092"
    topics => ["app-logs-payment"]
    group_id => "logstash-payment"
    consumer_threads => 4
    codec => json
  }

  # 에러 로그 (서비스별)
  kafka {
    bootstrap_servers => "kafka:9092"
    topics_pattern => "error-logs-.*"
    group_id => "logstash-error-logs"
    consumer_threads => 2
    codec => json
    decorate_events => true
  }

  # 접근 로그 (서비스별)
  kafka {
    bootstrap_servers => "kafka:9092"
    topics_pattern => "access-logs-.*"
    group_id => "logstash-access-logs"
    consumer_threads => 4
    codec => json
    decorate_events => true
  }

  # 감사 로그 (통합)
  kafka {
    bootstrap_servers => "kafka:9092"
    topics => ["audit-logs"]
    group_id => "logstash-audit-logs"
    consumer_threads => 2
    codec => json
    decorate_events => true
  }

  # 보안 로그 (통합)
  kafka {
    bootstrap_servers => "kafka:9092"
    topics => ["security-logs"]
    group_id => "logstash-security-logs"
    consumer_threads => 2
    codec => json
    decorate_events => true
  }
}

# ===== Filter: 데이터 가공 =====
filter {
  # Kafka 토픽 이름 저장
  mutate {
    add_field => {
      "kafka_topic" => "%{[@metadata][kafka][topic]}"
    }
  }

  # 토픽 이름에서 서비스명 추출
  # 예: app-logs-order-service → service: order-service
  if [kafka_topic] =~ /.*-(.+)/ {
    grok {
      match => { "kafka_topic" => "(?<log_type>[^-]+)-(?<log_category>[^-]+)-(?<service_name>.+)" }
    }
  }

  # 타임스탬프 파싱
  date {
    match => [ "@timestamp", "ISO8601" ]
    target => "@timestamp"
  }
}

# ===== Output: Elasticsearch로 저장 =====
output {
  elasticsearch {
    hosts => ["http://elasticsearch:9200"]

    # 토픽 이름 그대로 인덱스로 사용 (날짜별 분리)
    # 예: app-logs-order-service-2026.01.20
    index => "%{kafka_topic}-%{+YYYY.MM.dd}"

    # 문서 ID (중복 방지)
    document_id => "%{[@metadata][kafka][key]}-%{[@metadata][kafka][offset]}"
  }

  # 디버깅용 (선택사항)
  # stdout { codec => rubydebug }
}