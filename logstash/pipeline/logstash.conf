# ===== Input: Kafka에서 로그 읽기 =====
input {
  kafka {
    # Kafka 브로커 주소 (컨테이너 이름 사용!)
    bootstrap_servers => "kafka:9092"

    # 구독할 토픽 목록
    topics => ["app-logs", "access-logs", "error-logs", "business-events"]

    # Consumer Group ID
    group_id => "logstash-consumer-group"

    # ✅ 테스트 시에는 earliest 권장!
    auto_offset_reset => "earliest"
    # ❌ 프로덕션용 (새 메시지만)
    # auto_offset_reset => "latest"


    # JSON 파싱 (Kafka에서 받은 데이터를 JSON으로 파싱)
    codec => json {
      charset => "UTF-8"
    }

    # ✅ 토픽 메타데이터를 이벤트에 추가
    decorate_events => true

    # 성능 설정
    consumer_threads => 4
    max_poll_records => 500
  }
}

# ===== Filter: 로그 변환 =====
filter {
  # 1. Kafka 토픽 이름을 필드로 저장
  mutate {
    add_field => {
      "kafka_topic" => "%{[@metadata][kafka][topic]}"
    }
  }

  # 2. 타임스탬프 파싱 (@timestamp 필드가 있으면)
  if [@timestamp] {
    date {
      match => ["@timestamp", "ISO8601"]
      target => "@timestamp"
    }
  }

  # 3. 로그 레벨 정규화
  if [level] {
    mutate {
      uppercase => ["level"]
    }
  }

  # 4. User-Agent 파싱 (있는 경우)
  if [userAgent] {
    useragent {
      source => "userAgent"
      target => "user_agent"
    }
  }

  # 5. GeoIP 정보 추가 (있는 경우)
  if [clientIp] {
    geoip {
      source => "clientIp"
      target => "geoip"
    }
  }

  # 6. JSON 파싱 실패 태그 제거
  if "_jsonparsefailure" in [tags] {
    mutate {
      remove_tag => ["_jsonparsefailure"]
    }
  }

  # 7. 불필요한 필드만 제거 (원본은 유지)
  mutate {
    remove_field => ["event"]
  }
}

# ===== Output: Elasticsearch로 전송 =====
output {
  # Elasticsearch 출력
  elasticsearch {
    hosts => ["http://elasticsearch:9200"]
    # 토픽별로 다른 인덱스 생성
    index => "%{kafka_topic}-%{+YYYY.MM.dd}"
  }

  # 디버깅용 콘솔 출력(프로덕션에서는 불필요)
  stdout {
    codec => rubydebug
  }
}