# ===== Spring Boot 기본 설정 =====
spring:
  application:
    # 애플리케이션 이름 (ELK에서 애플리케이션 구분용)
    name: kafka-elk-demo

  # ===== Kafka 설정 =====
  kafka:
    # Kafka 브로커 주소
    # - 호스트에서 실행 시: localhost:29092
    # - 컨테이너에서 실행 시: kafka:9092
    bootstrap-servers: localhost:29092

    # ===== Producer 설정 =====
    # 메시지를 Kafka로 전송하는 설정
    producer:
      # Key Serializer: Key를 바이트로 변환하는 방법
      key-serializer: org.apache.kafka.common.serialization.StringSerializer

      # Value Serializer: Value를 바이트로 변환하는 방법
      value-serializer: org.apache.kafka.common.serialization.StringSerializer

      # Acks: 메시지 전송 확인 레벨
      # - all: 모든 복제본이 받았는지 확인 (가장 안전)
      # - 1: 리더만 확인
      # - 0: 확인 안함 (가장 빠름)
      acks: all

      # Retries: 전송 실패 시 재시도 횟수
      retries: 3

      # Batch Size: 배치로 모을 메시지 크기 (바이트)
      batch-size: 16384

      # Linger MS: 배치 전송 대기 시간 (밀리초)
      # 0이면 즉시 전송, 크면 배치 효율 증가
      linger-ms: 10

      # Compression: 압축 알고리즘
      # none, gzip, snappy, lz4, zstd
      compression-type: snappy

      # Buffer Memory: Producer가 사용할 버퍼 메모리 (바이트)
      buffer-memory: 33554432

    # ===== Consumer 설정 =====
    # Kafka에서 메시지를 받는 설정
    consumer:
      # Group ID: Consumer 그룹 식별자
      group-id: kafka-elk-consumer-group

      # Key Deserializer: 바이트를 Key로 변환
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer

      # Value Deserializer: 바이트를 Value로 변환
      value-deserializer: org.apache.kafka.common.serialization.StringDeserializer

      # Auto Offset Reset: 오프셋이 없을 때 시작 위치
      # - earliest: 처음부터
      # - latest: 최신부터
      auto-offset-reset: earliest

      # Enable Auto Commit: 자동 커밋 여부
      enable-auto-commit: false

      # Max Poll Records: 한 번에 가져올 최대 레코드 수
      max-poll-records: 500

    # ===== Listener 설정 =====
    listener:
      # Ack Mode: 커밋 방식
      # - MANUAL: 수동 커밋
      # - MANUAL_IMMEDIATE: 즉시 수동 커밋
      # - BATCH: 배치 자동 커밋
      ack-mode: manual

# ===== 커스텀 Kafka 설정 =====
# @ConfigurationProperties로 바인딩할 커스텀 설정
app:
  kafka:
    # 기본 설정 재사용
    bootstrap-servers: ${spring.kafka.bootstrap-servers}

    # ===== 로그 토픽 설정 =====
    topics:
      # 애플리케이션 로그 토픽
      app-logs:
        name: app-logs
        partitions: 3
        replication-factor: 1

      # 접근 로그 토픽
      access-logs:
        name: access-logs
        partitions: 3
        replication-factor: 1

      # 에러 로그 토픽
      error-logs:
        name: error-logs
        partitions: 2
        replication-factor: 1

      # 비즈니스 이벤트 토픽
      business-events:
        name: business-events
        partitions: 5
        replication-factor: 1

# ===== 로그 레벨 설정 =====
logging:
  level:
    # Root 로그 레벨
    root: INFO

    # 패키지별 로그 레벨
    com.example.kafka: DEBUG
    org.springframework.kafka: WARN
    org.apache.kafka: WARN

  # 로그 패턴 (콘솔용)
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss.SSS} [%thread] %-5level %logger{36} - %msg%n"

# ===== 서버 설정 =====
server:
  port: 8080