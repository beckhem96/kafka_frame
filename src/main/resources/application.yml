# ===== 공통 설정 =====
spring:
  application:
    name: order-service  # ✅ 서비스 이름 (토픽명에 사용됨)

  profiles:
    active: ${SPRING_PROFILES_ACTIVE:dev}  # 기본값: dev

# ===== 서비스 정보 =====
service:
  version: 1.0.0
  region: ${SERVICE_REGION:ap-northeast-2}

# ===== Logging 설정 =====
logging:
  config: classpath:logback-spring.xml
  level:
    root: INFO
    com.example.kafka: DEBUG

# ===== Actuator (모니터링) =====
management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics