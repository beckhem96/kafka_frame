spring:
  application:
    name: kafka-cassandra-chat-app
  kafka:
    bootstrap-servers: localhost:9092
  # ===== Cassandra 설정 (추가!) =====
  cassandra:
    # Cassandra 서버 주소
    contact-points: localhost
    # Cassandra 포트 (기본 9042)
    port: 9042
    # Keyspace 이름 (RDB의 Database와 유사)
    keyspace-name: chat_keyspace
    # 로컬 데이터센터 이름
    local-datacenter: datacenter1

    # 인증 정보 (필요 시)
    # username: cassandra
    # password: cassandra

    # 연결 설정
    connection:
      connect-timeout: 5000ms
      init-query-timeout: 5000ms

    # 요청 설정
    request:
      timeout: 2000ms
      consistency: LOCAL_QUORUM  # 일관성 레벨
app:
  kafka:
    bootstrap-servers: ${spring.kafka.bootstrap-servers}
    topics:
      chat:
        name: chat-topic
        partitions: 3
        replication-factor: 1
        configs:
          retention.ms: 86400000  # 1일
          cleanup.policy: delete
      notification:
        name: notification-topic
        partitions: 2
        replication-factor: 1
    consumer:
      group-id: chat-consumer-group
      auto-offset-reset: earliest
      max-poll-records: 100
      enable-auto-commit: false  # 수동 커밋
    producer:
      acks: all
      retries: 3
      batch-size: 16384
      linger-ms: 10
      compression-type: snappy

logging:
  level:
    org.apache.kafka: INFO
    com.datastax.oss.driver: INFO  # Cassandra 드라이버 로그
    com.example: DEBUG